    <g transform="translate(84, 32)" style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">
      <!-- Cercle doré autour de l'icône -->
      <circle cx="116" cy="90" r="78" fill="none" stroke="#C8963A" stroke-width="5" style="fill:none;stroke:rgb(200, 150, 58);color:rgb(0, 0, 0);stroke-width:5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
      <!-- Barres verticales (immeubles) -->
      <rect x="98" y="22" width="13" height="92" fill="#C8963A" style="fill:rgb(200, 150, 58);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
      <rect x="80" y="42" width="10" height="72" fill="#C8963A" style="fill:rgb(200, 150, 58);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
      <rect x="117" y="30" width="10" height="84" fill="#C8963A" style="fill:rgb(200, 150, 58);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
      <rect x="135" y="34" width="13" height="80" fill="#C8963A" style="fill:rgb(200, 150, 58);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
      <!-- Cache fond ondulations -->
      <polygon points="51,138 76,118 96,128 116,120 136,128 156,118 181,138" fill="#0A0A0A" stroke="none" style="fill:rgb(10, 10, 10);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
      <!-- Vagues / toits -->
      <polygon points="51,138 81,115 116,128 151,115 181,138" fill="none" stroke="#C8963A" stroke-width="4.5" stroke-linejoin="miter" style="fill:none;stroke:rgb(200, 150, 58);color:rgb(0, 0, 0);stroke-width:4.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
      <polygon points="66,138 88,121 116,132 144,121 166,138" fill="none" stroke="#C8963A" stroke-width="3" stroke-linejoin="miter" style="fill:none;stroke:rgb(200, 150, 58);color:rgb(0, 0, 0);stroke-width:3px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
      <polygon points="80,138 94,127 116,136 138,127 152,138" fill="none" stroke="#C8963A" stroke-width="2" stroke-linejoin="miter" style="fill:none;stroke:rgb(200, 150, 58);color:rgb(0, 0, 0);stroke-width:2px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
      <!-- Fenêtres -->
      <rect x="79" y="130" width="9" height="9" fill="none" stroke="#C8963A" stroke-width="1.5" style="fill:none;stroke:rgb(200, 150, 58);color:rgb(0, 0, 0);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
      <rect x="144" y="130" width="9" height="9" fill="none" stroke="#C8963A" stroke-width="1.5" style="fill:none;stroke:rgb(200, 150, 58);color:rgb(0, 0, 0);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
      <!-- Croix fenêtre gauche -->
      <line x1="83" y1="130" x2="83" y2="139" stroke="#0A0A0A" stroke-width="0.5" style="fill:rgb(0, 0, 0);stroke:rgb(10, 10, 10);color:rgb(0, 0, 0);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
      <line x1="79" y1="134" x2="88" y2="134" stroke="#0A0A0A" stroke-width="0.5" style="fill:rgb(0, 0, 0);stroke:rgb(10, 10, 10);color:rgb(0, 0, 0);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
      <!-- Croix fenêtre droite -->
      <line x1="148" y1="130" x2="148" y2="139" stroke="#0A0A0A" stroke-width="0.5" style="fill:rgb(0, 0, 0);stroke:rgb(10, 10, 10);color:rgb(0, 0, 0);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
      <line x1="144" y1="134" x2="153" y2="134" stroke="#0A0A0A" stroke-width="0.5" style="fill:rgb(0, 0, 0);stroke:rgb(10, 10, 10);color:rgb(0, 0, 0);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
      <!-- Croix centrale -->
      <line x1="111" y1="128" x2="111" y2="139" stroke="#0A0A0A" stroke-width="0.8" style="fill:rgb(0, 0, 0);stroke:rgb(10, 10, 10);color:rgb(0, 0, 0);stroke-width:0.8px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
      <line x1="104" y1="133" x2="128" y2="133" stroke="#0A0A0A" stroke-width="0.8" style="fill:rgb(0, 0, 0);stroke:rgb(10, 10, 10);color:rgb(0, 0, 0);stroke-width:0.8px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
    </g>

    <!-- Lignes décoratives horizontales avec losanges -->
    <line x1="47" y1="256" x2="157" y2="256" stroke="#C8963A" stroke-width="0.5" stroke-opacity="0.5" mask="url(#tmask)" style="fill:rgb(0, 0, 0);stroke:rgb(200, 150, 58);color:rgb(0, 0, 0);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
    <line x1="243" y1="256" x2="353" y2="256" stroke="#C8963A" stroke-width="0.5" stroke-opacity="0.5" mask="url(#tmask)" style="fill:rgb(0, 0, 0);stroke:rgb(200, 150, 58);color:rgb(0, 0, 0);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
    <rect x="156" y="250" width="8" height="8" fill="#C8963A" opacity="0.6" transform="rotate(45,160,254)" style="fill:rgb(200, 150, 58);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.6;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
    <rect x="236" y="250" width="8" height="8" fill="#C8963A" opacity="0.6" transform="rotate(45,240,254)" style="fill:rgb(200, 150, 58);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.6;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

    <!-- Texte principal "Genius Property" -->
    <text x="200" y="290" text-anchor="middle" fill="#C8963A" font-family="'Cormorant Garamond', Georgia, serif" font-size="38" font-weight="600" style="fill:rgb(200, 150, 58);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Cormorant Garamond&quot;, Georgia, serif;font-size:38px;font-weight:600;text-anchor:middle;dominant-baseline:auto">Genius Property</text>

    <!-- Ligne fine séparatrice -->
    <line x1="110" y1="300" x2="290" y2="300" stroke="#C8963A" stroke-width="0.3" stroke-opacity="0.3" style="fill:rgb(0, 0, 0);stroke:rgb(200, 150, 58);color:rgb(0, 0, 0);stroke-width:0.3px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

    <!-- Sous-titre -->
    <text x="200" y="318" text-anchor="middle" fill="#9A7E4A" font-family="Montserrat, Arial, sans-serif" font-size="11" font-weight="300" letter-spacing="3" style="fill:rgb(154, 126, 74);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Montserrat, Arial, sans-serif;font-size:11px;font-weight:300;text-anchor:middle;dominant-baseline:auto">GÉRANCE &amp; VENTE</text>
  </g>
</svg>