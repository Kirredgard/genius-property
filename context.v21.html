<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Genius Property — Contexte V21</title>
    <link rel="stylesheet" href="./styles/v21.css" />
  </head>
  <body>
    <main class="v21-shell">
      <nav class="v21-nav">
        <a href="./dashboard.v21.html">Dashboard</a>
        <a href="./rollout.v21.html">Rollout</a>
        <a href="./health.v21.html">Health</a>
      </nav>

      <header class="v21-section-header">
        <h1>Contexte utilisateur/agence V21</h1>
        <p>Définir temporairement l’agence et le rôle pour tester le rollout et les permissions.</p>
      </header>

      <section class="v21-form-card">
        <form id="context-form" class="v21-form">
          <label class="v21-form-field">
            <span>Agency ID</span>
            <input name="agencyId" placeholder="agency-demo" />
          </label>

          <label class="v21-form-field">
            <span>Rôle</span>
            <input name="role" placeholder="admin" />
          </label>

          <div class="v21-form-actions">
            <button type="submit">Sauvegarder contexte</button>
          </div>
        </form>
      </section>

      <section class="v21-form-card">
        <h2>Contexte actuel</h2>
        <pre id="context-output"></pre>
      </section>
    </main>

    <script type="module" src="./js/v21/pages/context.page.js"></script>
  </body>
</html>
